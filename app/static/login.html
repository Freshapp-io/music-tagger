<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Freshapp.io Music Tagger</title>
  <meta name="theme-color" content="#1E6FA5">
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/static/brand/icon-small.svg">
  <link rel="manifest" href="/static/brand/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32x32.png">
  <meta name="color-scheme" content="light dark">
  <script src="/static/theme.js"></script>
  <script src="/static/i18n.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="/static/brand/icon.svg" alt="">
      <span class="brand-name"><span class="fa"><span class="g">Fresh</span><span class="t">app</span><span class="i">.io</span></span><span class="app">Music Tagger</span></span>
    </div>
    <h1 data-i18n="Connexion">Connexion</h1>
    <form id="login" novalidate>
      <label for="user" data-i18n="Identifiant">Identifiant</label>
      <input id="user" name="user" autocomplete="username" required autofocus>
      <label for="password" data-i18n="Mot de passe">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="error" class="login-error" role="alert" aria-live="assertive"></p>
      <button class="primary" type="submit" data-i18n="Se connecter">Se connecter</button>
    </form>
    <div class="theme-switch login-lang" role="group" data-i18n-aria-label="Langue">
      <button type="button" data-lang-choice="fr" lang="fr" title="Français">FR</button><button type="button" data-lang-choice="en" lang="en" title="English">EN</button>
    </div>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>

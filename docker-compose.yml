# Freshapp Music Tagger — https://github.com/Freshapp-io/music-tagger
#
# Access to the music library is set in .env (see the `music` volume below).
services:
  music-tagger:
    build: .
    image: freshapp-music-tagger:latest
    container_name: freshapp-music-tagger
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8080"
    # Run as the owner of the music files so tags can be written.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      MUSIC_ROOT: /music/${MUSIC_SUBDIR:-}
      TRASH_DIR: /music/${MUSIC_SUBDIR:-}/.music-tagger-trash
      SCAN_THREADS: ${SCAN_THREADS:-8}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      MB_USER_AGENT: ${MB_USER_AGENT:-}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
    volumes:
      - music:/music
      - ./data:/data

volumes:
  # The library volume is configured from .env only (see .env.example):
  #   A) app on the NAS itself -> bind mount of a local folder (default)
  #        MUSIC_DEVICE=/srv/dev-disk/Medias
  #   B) app on another machine -> the container mounts the SMB share
  #        MUSIC_MOUNT_TYPE=cifs
  #        MUSIC_DEVICE=//nas/Medias
  #        MUSIC_MOUNT_OPTIONS=username=...,password=...,uid=1000,gid=1000,vers=3.0,iocharset=utf8
  music:
    driver: local
    driver_opts:
      type: ${MUSIC_MOUNT_TYPE:-none}
      device: ${MUSIC_DEVICE:-${MUSIC_PATH:-/srv/music}}
      o: ${MUSIC_MOUNT_OPTIONS:-bind}
